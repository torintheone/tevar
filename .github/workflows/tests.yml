name: tests

on:
  push:
  pull_request:

jobs:
  core:
    name: core (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.12 = Python of Slicer 5.10/5.12; 3.9 = Slicer 5.8 (compatibility floor)
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core requirements
        run: python -m pip install -r core/requirements-dev.txt
      - name: Run core tests
        run: python scripts/run_tests.py --core-only

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
